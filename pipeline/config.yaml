# Observatorio de Sostenibilidad Territorial de Marbella
# Configuracion del pipeline (Capa A)
# Las credenciales NUNCA figuran aqui: se leen de variables de entorno / .env

ambito:
  municipio: Marbella
  codigo_ine: "29069"
  codigo_nacional_cnig: "34012929069"   # nationalCode INSPIRE para el WFS del IGN
  provincia: Malaga
  comunidad: Andalucia

crs:
  calculo: 25830        # ETRS89 / UTM 30N — superficies y estadistica zonal en local
  peticion_sh: 32630    # WGS84 / UTM 30N — impuesto por Sentinel Hub, rechaza 25830
  publicacion: 4326     # solo para servir geometrias al frontend

geometria:
  fuente: CNIG
  endpoint: "https://www.ign.es/wfs-inspire/unidades-administrativas"
  typename: "au:AdministrativeUnit"
  # El servicio NO admite CQL_FILTER (responde 504): se descarga por bbox y se filtra en local
  bbox_descarga_4326: [36.45, -5.05, 36.62, -4.72]
  fichero_salida: "data/processed/limite_municipal.geojson"
  superficie_ha_referencia: 11714.2     # validada contra el PGOM 2025
  tolerancia_simplificacion_m: 20       # solo para aligerar la peticion remota
  buffer_marino_m: 2000                 # indicadores del Bloque 4

serie:
  fecha_inicio: "2017-01"
  fecha_fin: dinamica

unidades_analisis:
  - municipio
  - seccion_censal
  - malla_500m

fuentes:
  copernicus_sh:
    token_url: "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token"
    statistics_url: "https://sh.dataspace.copernicus.eu/api/v1/statistics"
    catalogo_odata: "https://catalogue.dataspace.copernicus.eu/odata/v1/Products"
    env_client_id: CDSE_CLIENT_ID
    env_client_secret: CDSE_CLIENT_SECRET
    tile_sentinel2: T30SUF              # un unico tile cubre el municipio
    cuota_pu_mensual: 10000

  pvgis:
    url: "https://re.jrc.ec.europa.eu/api/v5_3/MRcalc"
    requiere_registro: false

  ine:
    base: "https://servicios.ine.es/wstempus/js/ES"
    # El campo Fecha va en hora de Madrid; construir el periodo con Anyo + FK_Periodo
    usar_campo_fecha: false

  aemet:
    base: "https://opendata.aemet.es/opendata/api"
    env_api_key: AEMET_API_KEY          # pendiente de alta

indicadores:
  ndvi_municipal:
    activo: true
    titulo: NDVI medio municipal
    descripcion: >-
      Índice de vegetación de diferencia normalizada promediado sobre el término municipal,
      en compuesto mensual.
    coleccion: sentinel-2-l2a
    bandas_indice: [B08, B04]           # infrarrojo cercano y rojo
    resolucion_m: 20
    intervalo: P1M
    mosaico: leastCC
    scl_validas: [4, 5, 7]              # vegetacion, suelo desnudo, sin clasificar
    limitaciones:
      - El valor mensual es un compuesto, no una observación de fecha única.
      - >-
        La media municipal enmascara el fuerte gradiente altitudinal entre la costa y Sierra
        Blanca; su lectura exige estratificación por altitud.
      - Los meses sin observación válida se publican como hueco. No se interpolan.
      - >-
        El servicio Sentinel Hub no admite EPSG:25830; la petición se formula en EPSG:32630.
        Las superficies se calculan aparte en EPSG:25830.
      - >-
        La cobertura de 2017 es menor: hasta marzo de 2017 solo operaba la unidad S2A, con
        revisita de 10 días. Febrero de 2017 queda marcado por cobertura baja.
    salida: "data/processed/ndvi_municipal.json"

  ndbi_municipal:
    activo: false    # Retirado: NDBI = -NDMI exactamente (mismas bandas, orden invertido). Se comprobo
    # sobre la serie real: r = -1,0000 y la suma de ambos da 0,000000. Publicar los dos
    # seria el mismo numero dos veces. Se conserva el NDMI, cuyo nombre describe lo que
    # el numero mide de verdad. Para urbanizacion hace falta CLMS Land Cover a 10 m.
    titulo: NDBI, índice de superficie construida
    descripcion: >-
      Índice normalizado de superficie construida, que crece con el sellado del suelo y el
      material urbano y decrece con la vegetación.
    coleccion: sentinel-2-l2a
    bandas_indice: [B11, B08]           # infrarrojo de onda corta e infrarrojo cercano
    resolucion_m: 20
    intervalo: P1M
    mosaico: leastCC
    scl_validas: [4, 5, 7]
    limitaciones:
      - >-
        El NDBI no distingue suelo desnudo de superficie construida: en verano, el
        agostamiento del suelo eleva el índice sin que haya urbanización nueva. Debe leerse
        por comparación entre el mismo mes de años distintos, nunca mes a mes.
      - El valor mensual es un compuesto, no una observación de fecha única.
      - Los meses sin observación válida se publican como hueco. No se interpolan.
    salida: "data/processed/ndbi_municipal.json"

  lst_municipal:
    activo: true
    # Landsat y no Sentinel-3: 30 m frente a 1 km. Con 1 km el municipio son ~117 valores
    # y no admite lectura por barrios.
    coleccion: landsat-c2-l2
    banda: ST_B10                  # temperatura superficial ya corregida por emisividad
    resolucion_m: 30
    umbral_cobertura_escena: 70    # por debajo, la escena no representa al municipio
    salida: "data/processed/lst_municipal.json"

  radiacion_solar:
    activo: true
    # PVGIS-SARAH3 es un reanalisis cerrado (2005-2023), no una serie viva
    fuente: PVGIS-SARAH3
    puntos_por_lado: 4              # rejilla interior; los de fuera del termino se descartan
    salida: "data/processed/radiacion_solar.json"

  presion_turistica:
    activo: true
    # Bloque transversal: es el elemento diferencial del observatorio
    series_ine: [EOT42534, EOT42428, EOT3080]
    salida: "data/processed/presion_turistica.json"

  no2_troposferico:
    activo: true
    # Pixel de ~5,5 x 3,5 km: lectura comarcal, no municipal
    coleccion: sentinel-5p-l2
    resolucion_m: 3500
    salida: "data/processed/no2_troposferico.json"

  ndmi_municipal:
    activo: true
    titulo: NDMI, humedad de la vegetación
    descripcion: >-
      Índice de humedad de la vegetación. Mide el contenido de agua de la masa foliar, de modo
      que cae cuando la vegetación entra en estrés hídrico. Es un indicador temprano de sequía
      y de riesgo de incendio, anterior a que el NDVI acuse la pérdida de verdor.
    coleccion: sentinel-2-l2a
    bandas_indice: [B08, B11]           # infrarrojo cercano y de onda corta
    resolucion_m: 20
    intervalo: P1M
    mosaico: leastCC
    scl_validas: [4, 5, 7]
    limitaciones:
      - >-
        Responde al agua de la hoja, no a la del suelo: en zonas sin cubierta vegetal el
        índice pierde significado.
      - El valor mensual es un compuesto, no una observación de fecha única.
      - Los meses sin observación válida se publican como hueco. No se interpolan.
    salida: "data/processed/ndmi_municipal.json"

  nbr_municipal:
    activo: false    # Retirado: r = 0,99 con el NDMI como media municipal, es decir, sin informacion
    # independiente. El NBR es la herramienta correcta para CARTOGRAFIAR cicatrices de
    # incendio pixel a pixel, no para una media sobre 11.714 ha.
    titulo: NBR, índice de área quemada
    descripcion: >-
      Índice normalizado de área quemada. Desciende bruscamente tras un incendio y se recupera
      con la revegetación, por lo que sirve para detectar y seguir cicatrices de fuego en
      Sierra Blanca y el resto del monte del término.
    coleccion: sentinel-2-l2a
    bandas_indice: [B08, B12]           # infrarrojo cercano y de onda corta larga
    resolucion_m: 20
    intervalo: P1M
    mosaico: leastCC
    scl_validas: [4, 5, 7]
    limitaciones:
      - >-
        La media municipal diluye incendios pequeños: un fuego de pocas hectáreas apenas mueve
        el valor sobre 11.714 ha. Detecta episodios de cierta entidad, no cualquier conato.
      - >-
        El índice también desciende con el agostamiento estival, de modo que un mínimo de
        verano no implica incendio. Debe compararse el mismo mes entre años.
      - Los meses sin observación válida se publican como hueco. No se interpolan.
    salida: "data/processed/nbr_municipal.json"

  ndwi_municipal:
    activo: true
    titulo: NDWI, superficie de agua
    descripcion: >-
      Índice normalizado de agua. Realza las láminas de agua libre del término, embalses y
      cauces incluidos, y desciende cuando se reducen.
    coleccion: sentinel-2-l2a
    bandas_indice: [B03, B08]           # verde e infrarrojo cercano
    resolucion_m: 20
    intervalo: P1M
    mosaico: leastCC
    scl_validas: [4, 5, 6, 7]           # aqui SI se incluye la clase agua: es lo que se mide
    limitaciones:
      - >-
        Es un índice medio sobre todo el término, no una superficie de agua en hectáreas.
        Sirve para leer la evolución relativa, no para cuantificar volumen embalsado.
      - El valor mensual es un compuesto, no una observación de fecha única.
      - Los meses sin observación válida se publican como hueco. No se interpolan.
    salida: "data/processed/ndwi_municipal.json"

  ozono_troposferico:
    activo: true
    titulo: Ozono en columna total
    descripcion: >-
      Columna total de ozono sobre el municipio. Su ciclo anual responde a la dinámica
      atmosférica de latitudes medias, con máximo en primavera.
    banda: O3
    unidad: DU
    factor_escala: 2241.4               # de mol/m2 a unidades Dobson
    resolucion_m: 3500
    salida: "data/processed/ozono_troposferico.json"

  aerosoles:
    activo: true
    titulo: Índice de aerosoles
    descripcion: >-
      Índice de aerosoles ultravioleta. Se eleva con la presencia de partículas absorbentes en
      la atmósfera, señaladamente polvo sahariano, frecuente en el litoral andaluz.
    banda: AER_AI_340_380
    unidad: adimensional
    factor_escala: 1
    resolucion_m: 3500
    limitaciones_extra:
      - >-
        Detecta aerosoles absorbentes en altura, sobre todo polvo mineral y humo. No mide
        partículas en superficie ni equivale a PM10 o PM2,5.
    salida: "data/processed/aerosoles.json"

  monoxido_carbono:
    activo: true
    titulo: Monóxido de carbono en columna
    descripcion: >-
      Columna total de monóxido de carbono. Procede de combustión incompleta, tanto de tráfico
      e industria como de incendios, y puede llegar transportado desde lejos.
    banda: CO
    unidad: mmol/m²
    factor_escala: 1000                 # de mol/m2 a milimol/m2
    resolucion_m: 3500
    salida: "data/processed/monoxido_carbono.json"

  clorofila_litoral:
    activo: true
    # Se agrega sobre la franja marina de 2 km, no sobre el termino terrestre
    coleccion: SENTINEL3_OLCI_L2_WATER
    banda: CHL_NN
    salida: "data/processed/clorofila_litoral.json"

calidad:
  tamano_maximo_fichero_mb: 5
  interpolar_huecos: false              # los huecos se publican como ausencia explicita
