name: Actualización semanal (Sentinel-2)

# Cadencia real de la fuente: Sentinel-2 revisita cada 2-3 días sobre Marbella y el dato
# aparece en el CDSE en horas. Un sondeo semanal es suficiente y no desperdicia cuota.
on:
  schedule:
    - cron: '0 4 * * 1'   # lunes 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: datos-semanal
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    outputs:
      hubo_cambio: ${{ steps.publicar.outputs.hubo_cambio }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Sin esta caché el pipeline recalcularía la serie completa en cada pasada
      # (583 PU frente a 35). data/raw no se versiona, así que ha de persistir aquí.
      # La clave incluye config.yaml: si cambia la configuración del indicador, la caché
      # se invalida y el recálculo completo ocurre, que es justo lo que se quiere.
      - name: Recuperar caché de la serie
        uses: actions/cache@v4
        with:
          path: data/raw/sh_statistics
          key: sh-stats-${{ hashFiles('pipeline/config.yaml') }}-${{ github.run_id }}
          restore-keys: |
            sh-stats-${{ hashFiles('pipeline/config.yaml') }}-

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Ejecutar pipeline
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python pipeline/run_all.py

      # Solo se versionan los productos ligeros. Los rásters crudos nunca, y tampoco
      # estado.json, que cambia en cada pasada y forzaría un commit sin dato nuevo.
      - name: Publicar si hay dato nuevo
        id: publicar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/metadata web/data
          if git diff --staged --quiet; then
            echo "Sin dato nuevo: no se hace commit."
            echo "hubo_cambio=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: actualización automática sentinel-2 $(date -u +%Y-%m-%d)"
            git push
            echo "hubo_cambio=true" >> "$GITHUB_OUTPUT"
          fi

      # El sitio se redespliega siempre, aunque no haya dato nuevo: así la fecha de
      # última comprobación queda actualizada sin ensuciar el historial del repositorio.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Abrir incidencia si el pipeline falla
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `Fallo del pipeline semanal (${new Date().toISOString().slice(0,10)})`;
            const existentes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pipeline'
            });
            // No se duplica la incidencia si ya hay una abierta por el mismo motivo
            if (!existentes.data.some(i => i.title === titulo)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, labels: ['pipeline'],
                body: `La ejecución automática ha fallado.\n\n`
                    + `Registro: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                    + `/actions/runs/${context.runId}\n\n`
                    + `El sitio sigue mostrando el último dato válido con su fecha.`
              });
            }

  desplegar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
