name: Actualización semanal (Sentinel-2)

# Cadencia real de la fuente: Sentinel-2 revisita cada 2-3 días sobre Marbella y el dato
# aparece en el CDSE en horas. Un sondeo semanal es suficiente y no desperdicia cuota.
on:
  schedule:
    - cron: '0 4 * * 1'   # lunes 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: datos-semanal
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Ejecutar pipeline
        id: pipeline
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python pipeline/run_all.py

      # Solo se versionan los productos ligeros. Los rásters crudos nunca.
      - name: Publicar si hay dato nuevo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/metadata web/data
          if git diff --staged --quiet; then
            echo "Sin cambios: no se hace commit."
          else
            git commit -m "data: actualización automática sentinel-2 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Abrir incidencia si el pipeline falla
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `Fallo del pipeline semanal (${new Date().toISOString().slice(0,10)})`;
            const existentes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pipeline'
            });
            // No se duplica la incidencia si ya hay una abierta por el mismo motivo
            if (!existentes.data.some(i => i.title === titulo)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, labels: ['pipeline'],
                body: `La ejecución automática ha fallado.\n\n`
                    + `Registro: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                    + `/actions/runs/${context.runId}\n\n`
                    + `El sitio sigue mostrando el último dato válido con su fecha.`
              });
            }
