name: Actualización semanal (Copernicus, Landsat, INE y PVGIS)

# Cadencia real de la fuente: Sentinel-2 revisita cada 2-3 días sobre Marbella y el dato
# aparece en el CDSE en horas. Un sondeo semanal es suficiente y no desperdicia cuota.
on:
  schedule:
    - cron: '0 4 * * 1'   # lunes 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: datos-semanal
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    outputs:
      hubo_cambio: ${{ steps.publicar.outputs.hubo_cambio }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Sin esta caché el pipeline recalcularía cada serie completa en cada pasada:
      # 583 PU frente a 35 en los índices de Sentinel-2, 316 escenas de Landsat en vez de
      # las nuevas, y más de una hora de openEO para la clorofila. data/raw no se versiona,
      # así que ha de persistir aquí.
      # La clave incluye config.yaml: si cambia la configuración del indicador, la caché
      # se invalida y el recálculo completo ocurre, que es justo lo que se quiere.
      - name: Recuperar caché de la serie
        uses: actions/cache@v4
        with:
          path: |
            data/raw/sh_statistics
            data/raw/landsat
            data/raw/openeo
            data/raw/pvgis
            data/raw/ine
            data/raw/cnig_unidades_administrativas.gml
          # La clave NO depende de config.yaml a proposito. Atarla al hash del fichero
          # invalidaba toda la cache al anadir un indicador nuevo, obligando a rebajar de
          # nuevo las 316 escenas de Landsat y los 19 trimestres de clorofila, que cuestan
          # horas. La invalidacion correcta ya la hace el pipeline por indicador, con
          # hash_config en el manifiesto: si cambia el calculo de un indicador, solo ese se
          # recalcula. Subir el numero de version fuerza una purga manual si hiciera falta.
          key: datos-crudos-v1-${{ github.run_id }}
          restore-keys: |
            datos-crudos-v1-

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Ejecutar pipeline
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python pipeline/run_all.py

      # Solo se versionan los productos ligeros. Los rásters crudos nunca, y tampoco
      # estado.json, que cambia en cada pasada y forzaría un commit sin dato nuevo.
      - name: Publicar si hay dato nuevo
        id: publicar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/metadata web/data
          if git diff --staged --quiet; then
            echo "Sin dato nuevo: no se hace commit."
            echo "hubo_cambio=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: actualización automática $(date -u +%Y-%m-%d)"
            # El pipeline puede tardar una hora larga y entretanto alguien puede haber
            # empujado: sin rebase el push se rechaza por non-fast-forward y el commit se
            # pierde, ademas de saltarse el despliegue. Se reintenta rebasando.
            for intento in 1 2 3; do
              if git push; then break; fi
              echo "push rechazado, rebasando (intento $intento)"
              git pull --rebase --strategy-option=theirs origin main || exit 1
              sleep 5
            done
            echo "hubo_cambio=true" >> "$GITHUB_OUTPUT"
          fi

      # El sitio se redespliega siempre, aunque no haya dato nuevo: así la fecha de
      # última comprobación queda actualizada sin ensuciar el historial del repositorio.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Abrir incidencia si el pipeline falla
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = `Fallo del pipeline semanal (${new Date().toISOString().slice(0,10)})`;
            const existentes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pipeline'
            });
            // No se duplica la incidencia si ya hay una abierta por el mismo motivo
            if (!existentes.data.some(i => i.title === titulo)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, labels: ['pipeline'],
                body: `La ejecución automática ha fallado.\n\n`
                    + `Registro: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                    + `/actions/runs/${context.runId}\n\n`
                    + `El sitio sigue mostrando el último dato válido con su fecha.`
              });
            }

  desplegar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
